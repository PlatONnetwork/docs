name: Check code format
on:
  pull_request:
    branches:
      - master
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        ref: master

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 检查是否可以编译成功
    - name: Build
      run: cd website && npm install && npm run build
